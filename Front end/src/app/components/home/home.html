<app-navbar></app-navbar>
<app-aviso-home></app-aviso-home>


@if(showModal2){
  <app-registro2
  [isOpen]="showModal2"
  [formulario]="formularioNewNed"
  [segundaCat]="segundaCat"
  [catalogoUT]="catalogoUT"  
  (closeFormulario)="cerrarFormulario()">
</app-registro2>
}

@if(showModalSumate){
<app-sumate-necesidad [isOpen2]="showModalSumate" (close)="closeModalSumate()">
</app-sumate-necesidad>
}

<div class="fondo">

    <img src="assets/Home.png" class="bg-img" alt="">

    <div class="seccion-opciones">

        <div class="header-bar">
            <button class="menu-btn" (click)="toggleMenu()">
                ☰
            </button>

            <div class="overlay" *ngIf="menuAbierto" (click)="toggleMenu()"></div>

            <div class="menu-lateral" [class.open]="menuAbierto">

                <div class="menu-header">
                    <button class="close-btn" (click)="toggleMenu()">☰</button>
                    <span>Estadísticas generales</span>
                </div>

                <div class="chart-panel">
                    <div class="chart-wrapper">
                        <canvas id="chartNecesidades"></canvas>
                    </div>
                </div>
            </div>

            <div class="linea-vertical"></div>

            <div class="contenido-central">
                <form [formGroup]="formularioNewNed!">
                    <div class="imagen-container text-center">
                        <!--img src="assets/NuevaNecesidad.png" class="boton-imagen" (click)="openModal()"-->
                    </div>
                    <div class="formulario-grid">
                        <div class="form-col">
                            <div class="mb-3">
                                <label class="form-label">Título de la necesidad</label>
                                <input type="text" class="form-control input-transparente" formControlName="titulo">
                            </div>

                            <div class="mb-3 d-flex align-items-center">
                                <label class="form-label me-3">Categoría</label>
                                <select class="form-select"
                                    class="form-select flex-grow-1"
                                    formControlName="catUno"
                                    (change)="onChangeCat1($event)">
                                    <option value="" selected>Seleccione una opción</option>
                                    @for (item of primerCAt; track item) {
                                    <option [value]="item.id">{{item.primera_categoria}}</option>
                                    }
                                </select>
                            </div>
                        </div>

                        <div class="form-col">
                            <div class="mb-3 d-flex align-items-center">
                                <label class="form-label me-3">Alcaldía</label>
                                 <select 
                                    class="form-select flex-grow-1"
                                    formControlName="alcaldiar"
                                    (change)="onChangeAlcaldia($event)">
                                    <option value="" selected>Seleccione una opción</option>
                                    @for (item of catalogoAlcaldia; track item) {
                                    <option [value]="item.id">{{item.demarcacion_territorial}}</option>
                                    }
                                </select>
                            </div>

                            <div class="text-end mt-4">
                                <button type="button" class="btn-aceptar" (click)="openModal()">
                                    Continuar
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="linea-vertical"></div>
        </div>
    </div>

    <div class="banner-wrapper">
        <section class="banner-oscuro" [ngClass]="{ 'active': currentBanner === 1 }">
            <!--img src="assets/SumateNecesidad2.png" class="sumate" alt="header"-->
            <div class="banner-inner">

                <div class="card col-9 col-md-9 mx-auto">
                    <div class="card-body">
                        <form [formGroup]="formularioRegistro!">
                            <div class="row g-3 filtros-row">

                                <div class="col-md-6 d-flex align-items-center">
                                    <label class="card-title col-2">Unidad Territorial</label>
                                    <select class="form-select" formControlName="ut" (change)="onChangeUT($event)">
                                        <option value="" selected>Seleccione una opción</option>
                                        @for (item of catalogoUT; track item) {
                                        <option [value]="item.id">{{item.unidad_territorial}}</option>
                                        }
                                    </select>
                                </div>

                                <div class="col-md-6 d-flex align-items-center">
                                    <label class="card-title col-2">Palabra Clave</label>

                                    <input class="form-control" placeholder="Buscar..."
                                        (input)="filtrarPorPalabra($event)">
                                </div>
                            </div>
                            <br>

                            <div class="row g-3 filtros-row">

                                <div class="col-md-6 d-flex align-items-center">
                                    <label class="card-title col-2">Categoría</label>
                                    <select class="form-select flex-grow-1" formControlName="catUno"
                                        (change)="onChangeCat($event)">
                                        <option value="" selected>Seleccione una opción</option>
                                        @for (item of primerCAt; track item) {
                                        <option [value]="item.id">{{item.primera_categoria}}</option>
                                        }
                                    </select>
                                </div>

                                <div class="col-md-4 d-flex align-items-center">
                                    <label class="card-title col-3">Ordenar por</label>

                                    <select formControlName="ordenar" class="form-control"
                                        (change)="ordenarVotos($event)">
                                        <option [ngValue]="null">Selecciona</option>
                                        <option [ngValue]="1">Mas apoyos</option>
                                        <option [ngValue]="2">Más recientes</option>
                                        <option [ngValue]="3">A - Z</option>
                                    </select>
                                </div>

                                <div class="col-md-2 d-flex align-items-center">
                                    <button type="button" class="btn-aceptar" (click)="limpiarFiltros()">
                                        Limpiar
                                    </button>
                                </div>

                            </div>

                            <div class="table-container">
                                <table class="table tabla-necesidades">
                                    <thead>
                                        <tr>
                                            <th class="col-titulo">Título</th>
                                            <th class="col-descripcion">Descripción</th>
                                            <th class="col-categoria">Categoría</th>
                                            <th class="col-votos">Contador de Apoyos</th>
                                            <th>Apoyar</th>
                                            <th>Compartir</th>
                                        </tr>
                                    </thead>

                                    <tbody>
                                        <tr *ngFor="let item of paginatedData">
                                            <td class="col-titulo">{{ item.titulo_necesidad }}</td>
                                            <td class="col-descripcion">{{ item.descripcion_necesidad }}</td>
                                            <td class="col-categoria">{{ item.categoria }}</td>
                                            <td class="col-votos">{{ item.total_votos }}</td>

                                            <td class="apoyar-btn">
                                                <button *ngIf="tipo_usuario === 1" class="btn-votar-pulse"
                                                    (click)="votar(item.id_necesidad)">
                                                    +
                                                </button>
                                            </td>

                                            <td class="col-compartir">
                                                <button *ngIf="tipo_usuario === 1" class="btn-compartir"
                                                    (click)="compartir(item.id_necesidad)">
                                                    Compartir
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                                <div class="pagination">
                                    <button (click)="prevPage()" [disabled]="currentPage === 1">
                                        ⬅ Anterior
                                    </button>

                                    <span>Página {{ currentPage }} de {{ totalPages }}</span>

                                    <button (click)="nextPage()" [disabled]="currentPage === totalPages">
                                        Siguiente ➡
                                    </button>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>

</div>
