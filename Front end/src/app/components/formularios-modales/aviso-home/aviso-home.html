<div class="modal fade" id="modalAvisoHome" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl-custom">
    <div class="modal-content modal-container">
      <img src="assets/Recuerda.png" class="aviso-importante" alt="imagen">
      <div class="modal-body">

        <div class="container text-center col-12">
          <div class="row">
            <div class="col-12">
              <label class="texto-correo">
                  <strong>"Los resultados de este foro ciudadano no tendrán carácter vinculante.</strong> Servirán
                  como insumo para un diagnóstico colaborativo sobre las necesidades urbanas y
                  comunitarias de cada unidad territorial, así como guía orientadora para las autoridades
                  competentes en materia de presupuesto participativo. <strong>Los únicos resultados con
                    validez jurídica serán los derivados de la Consulta Ciudadana del Presupuesto
                    Participativo."</strong>
                </label>
            </div>
          </div>
          <div class="row mt-5">
            <div class="col">
              <div class="row">
                <div class="col-6">
                  <input type="checkbox" id="privacidad" (change)="activarBoton($event)" />
                  <span class="link-privacidad">He leído el presente aviso</span>
                </div>
                <div class="col-6">
                  <button id="btnAceptar" class="btn-aceptar" type="button" (click)="aceptarAviso()" data-bs-dismiss="modal" disabled>Aceptar</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <hr>
    </div>
  </div>
</div>

<div class="modal fade" id="modalAvisoRecuerda" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl-custom">
    <div class="modal-content modal-container">

      <img src="assets/Recuerda.png" class="aviso-importante" alt="imagen">

      <div class="modal-body">
        <label class="texto-correo">
          <strong>"Los resultados de este foro ciudadano no tendrán carácter vinculante.</strong> Servirán
          como insumo para un diagnóstico colaborativo sobre las necesidades urbanas y
          comunitarias de cada unidad territorial, así como guía orientadora para las autoridades
          competentes en materia de presupuesto participativo. <strong>Los únicos resultados con
            validez jurídica serán los derivados de la Consulta Ciudadana del Presupuesto
            Participativo."</strong>
        </label>
      </div>

      <div class="d-flex justify-content-center mt-3">
        <button id="btnRecuarda" class="btn-aceptar" type="button" (click)="aceptarAviso()" data-bs-dismiss="modal">
          Aceptar
        </button>
      </div>
      <hr>
    </div>
  </div>
</div>

@if (mostrarFrame) {
  <div class="video-overlay" (click)="cerrarFrame()">
    <div class="video-wrapper" (click)="$event.stopPropagation()">
      <iframe
        [src]="videoUrl"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  </div>
}


<!--  Aviso Importante -->
<div class="modal fade" id="modalAvisoLogin" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl-custom">
    <div class="modal-content modal-container">
      <img src="assets/AvisoImportante.png" class="aviso-importante" alt="imagen">
      <div class="modal-body">
        <label class="texto-correo">
          <strong>"El Instituto Electoral de la Ciudad de México</strong> te da la Bienvenida al <strong>Repositorio de Necesidades 
          2026-2027.</strong> Una herramienta de apoyo a la deliberación digital colaborativa en la que <strong>podrás expresar</strong>
          las <strong>necesidades urbanas y sociales</strong> de la unidad territorial o pueblo originario en que resides. 
          Los datos recabados podrán ser parte del <strong>diagnóstico de la Consulta del Presupuesto Participativo </strong> y 
          conformarán un historial que brindará información valiosa sobre la evolución de la participación 
          ciudadana en la capital
          <br>
          <strong>¡Consulta</strong> lo que tus vecinas y vecinos han <strong>expresado y suma tus propuestas. Registrarte</strong> es muy fácil!
          <hr>
        </label>
      </div>

      <br>

      <div class="container mt-3">
        <div class="row align-items-center justify-content-end">

          <div class="col-auto checkbox-container">
          </div>

          <div class="col-auto">
            <button id="btnAceptar" class="btn-aceptar" type="button" (click)="aceptarAviso()" data-bs-dismiss="modal">
              Aceptar
            </button>
          </div>

        </div>
      </div>


    </div>
  </div>
</div>
