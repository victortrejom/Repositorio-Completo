<div class="modal show fade d-block" id="modalFormulario2" tabindex="-1" *ngIf="isOpen"
    style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content modal-nueva">

            <img src="assets/Describe.png" class="necesidad" alt="header"-->

            <div class="modal-body">
                <form [formGroup]="formulario!" (ngSubmit)="guardarDatos()">

                    @if(isUpdate){
                    <div class="row g-3 mb-3">
                        <div class="col-md-3">
                            <label class="form-label">Folio:</label>
                        </div>
                        <div class="col-md-5">
                            <input type="text" class="form-control"
                                style="background-color: rgba(0, 255, 36, 0.71); color: #000;" formControlName="folio">
                        </div>
                    </div>
                    }

                    <div *ngIf="paso === 1">
                        <h5 class="seccion-titulo">
                            Selecciona la categoría que más describa tu problemática
                        </h5>
                        <hr>

                        <div class="row g-3 justify-content-center">
                            <div class="col-md-10 d-flex align-items-center gap-3">
                                <label class="form-label col-2">Segunda categoría</label>
                                <select class="form-select" formControlName="catDos"
                                    (change)="onChangeCatDos()">
                                    <option value="">Seleccione una opción</option>
                                    @for (item of segundaCat; track item) {
                                    <option [value]="item.id">{{item.segunda_categoria}}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <br>

                        <div class="row g-3 justify-content-center">
                            <div class="col-md-10 d-flex align-items-center gap-3">
                                <label class="form-label col-2">Categoría específica</label>
                                <select class="form-select" formControlName="catTres">
                                    <option value="">Seleccione una opción</option>
                                    @for (item of tercerCat; track item) {
                                    <option [value]="item.id">{{item.tercera_categoria}}</option>
                                    }
                                </select>
                            </div>
                        </div>
                        <br>

                        <div class="row g-3 justify-content-center">
                            <div class="col-md-10 d-flex align-items-center gap-3">
                                <label class="form-label col-2">Enfoque específico</label>
                                <select class="form-select flex-grow-1" formControlName="enfoqueEsp">
                                    <option value="">Seleccione una opción</option>
                                    @for (item of enfoqueESP; track item) {
                                    <option [value]="item.id">{{item.enfoque_especifico}}</option>
                                    }
                                </select>
                            </div>
                        </div>


                    </div>

                    <div *ngIf="paso === 2">
                        <div class="row">
                        <div class="col-md-9">
                            <label class="form-label">Unidad Territorial</label>
                            <select class="form-select" formControlName="utr" (change)="onChangeUT()">
                                <option value="" selected>Seleccione una opción</option>
                                @for (item of catalogoUT; track item) {
                                <option [value]="item.id">{{item.unidad_territorial}}</option>
                                }
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">Clave UT</label>
                            <input type="text" class="form-control" formControlName="claveUT" placeholder="">
                        </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label">Descripción del problema y posible solución</label>
                            <textarea rows="4" class="form-control" maxlength="1000"
                                formControlName="descripcion"></textarea>
                        </div>

                    </div>

                    <div class="container text-center mt-4" *ngIf="tipo_usuario === 1 && !isUpdate">

                        <div *ngIf="paso === 1" class="row justify-content-center">
                            <div class="col-5">
                                <button class="btn-cancelar" type="button" (click)="cancelar()">Cancelar</button>
                            </div>
                            <div class="col-4">
                                <button type="button" class="btn-aceptar" (click)="siguientePaso()">
                                    Continuar
                                </button>
                            </div>
                        </div>

                        <!-- PASO 2 -->
                        <div *ngIf="paso === 2" class="row justify-content-center">
                            <div class="col-4">
                                <button type="button" class="btn-cancelar" (click)="pasoAnterior()">Regresar</button>
                            </div>
                            <div class="col-5">
                                <button class="btn-aceptar" type="submit" [disabled]="formulario.invalid">
                                    Guardar
                                </button>
                            </div>
                        </div>

                    </div>

                    @if(isUpdate) {
                    <div class="container text-center mt-4" *ngIf="tipo_usuario === 1">
                        <div class="row justify-content-center">
                            <div class="col-12">
                                <button class="btn-aceptar" type="button" (click)="cancelarExitoso()">Aceptar</button>
                            </div>
                        </div>
                    </div>
                    }

                    <div class="container text-center mt-4" *ngIf="tipo_usuario !== 1">
                        <div class="row justify-content-center">
                            <div class="col-4">
                                <button class="btn-aceptar" type="button" (click)="cancelar()">Cerrar</button>
                            </div>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

@if(showModal){
<app-nueva-necesidad [isOpen]="showModal" [idNecesidadNew]="idSeleccionado" (close)="closeModal()">
</app-nueva-necesidad>
}
