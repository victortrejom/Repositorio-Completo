<app-navbar></app-navbar>
<img src="assets/Fondo.png" class="bg-img" alt="">

<div class="container-fluid text-center" style="max-width: 100vm; margin-top: 100px; margin-left: 0px;">
    <div class="row">
        <!-- Filas -->
        <div class="col">
        <!-- columnas -->
            <div class="container">
                <div class="row align-items-start"  style="width: 120%;">
                    <div class="col-8 d-flex justify-content-center">
                        <div class="input-group w-80">
                            <input
                                type="text"
                                class="form-control"
                                placeholder="Buscar..."
                                aria-label="Buscar"
                                aria-describedby="basic-addon1">
                                <span class="input-group-text">🔍</span>
                        </div>
                    </div>

                    <div class="col-4 text-end">
                        <img
                            src="assets/Necesidades.png"
                            class="img-fluid mb-2"
                            alt="necesidades">

                        <p class="card-text">
                            Puedes ver el total de apoyos<br>
                            que han recibido las necesidades <br>
                            dando
                            <span class="clic-aqui" (click)="verNecesidades()">clic aquí</span>
                        </p>

                        <div class="aviso-privacidad">
                            <p>
                            Conoce
                            <a href="https://www.iecm.mx/www/transparencia/avisoprivacidad/2025/DEPCyC/INTEGRAL-SDP-IMPCyORC.pdf"
                                target="_blank">
                                aquí
                            </a>
                            el aviso de privacidad.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <form [formGroup]="formularioLogin">
                <div class="container card-inicio-sesion">
                    <div class="row">
                        <div class="col">
                            <img src="assets/Sesion.png" class="card-img-top" alt="otra">
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-12">
                            <input type="email" class="form-control email-input" placeholder="Correo electrónico" formControlName="correo_electronico">                
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">
                        <input type="password" class="form-control pass-input" placeholder="Contraseña" formControlName="password">
                        </div>
                    </div>

                    @if(formularioLogin.valid) {
                    <div class="row mt-4">
                        <div class="col text-center">
                            <ng-hcaptcha siteKey="296ccb74-b9f8-4f7a-8f8e-8eaed73a0c14" 
                                (verify)="onVerify($event)"
                                (expired)="onExpired($event)"
                                (error)="onError($event)">
                            </ng-hcaptcha>
                        </div>
                    </div>
                    }   

                    <div class="row">
                        <div class="col botones-centrados">
                            <button class="btn-ingresar" type="submit" (click)="ingresar()" [disabled]="!captchaValido">Ingresar</button>
                            <button class="btn-registrarme" type="button" (click)="registrarme()">Registrarme</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-container">
        <img src="assets/NuevoUsu.png" class="avisos" alt="otra">

        <form [formGroup]="formulario" (ngSubmit)="guardarDatos()">

            <label for="nombre">Nombre Completo</label>
            <input id="nombre" formControlName="nombre" type="text" maxlength="300"
                placeholder="Nombre Apellido Apellido">

            <label for="email">Correo electrónico</label>
            <input id="email" formControlName="email" type="email" maxlength="250" placeholder="correo@dominio.com">

            <label for="password">Contraseña</label>
            <input id="password" formControlName="password" type="password" maxlength="300" placeholder="contraseña">

            <label for="repassword">Vuelve a escribir la contraseña</label>
            <input id="repassword" formControlName="repassword" type="password" placeholder="contraseña">


            <div class="checkbox-container">
                <input type="checkbox" id="privacidad" formControlName="privacidad">
                <label for="privacidad"><span>Acepto el <a class="link-privacidad" href="https://www.iecm.mx/www/transparencia/avisoprivacidad/2025/DEPCyC/SIMPLIFICADO-SDP-IMPCyORC.pdf" target="_blank">Aviso de privacidad</a></span></label>
            </div>

            <hr>

            <div class="container text-center">
                <div class="row justify-content-center">
                    <div class="col-6">
                        <button class="btn-aceptar" type="submit" [disabled]="formulario.invalid">Registrarme</button>
                    </div>
                    <div class="col-6">
                        <button class="btn-cancelar" type="button" (click)="cancelar()">Cancelar</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
