<div class="modal show fade d-block" id="modalFormulario" tabindex="-1" *ngIf="isOpen" style="background: rgba(0,0,0,0.5);">
        <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content modal-nueva">

            <img  *ngIf="!isUpdate" src="assets/NewNecesidad.png" class="necesidad" alt="header">

            <img  *ngIf="isUpdate&&noImg" src="assets/RegistroExitoso.png" class="necesidad" alt="header">

            
            <div class="modal-body">
                <form [formGroup]="formularioRegistro!" (ngSubmit)="guardarDatos()">

                @if(isUpdate){
                    <div class="row g-3">
                        <div class="col-md-4">                        
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Folio:</label>
                        </div>

                        <div class="col-md-5">
                            <input type="text" class="form-control"
                            style="background-color: rgba(0, 255, 36, 0.71); color: #000;"
                            formControlName="folio" placeholder="">
                        </div>
                    </div>
                }

                <h3 class="seccion-titulo">Ubicación</h3>

                <div class="row g-3">
                    <div class="col-md-12 d-flex align-items-center campo-horizontal">
                        <label class="me-2 etiqueta-horizontal">Alcaldía:</label>
                        <select 
                            class="form-select flex-grow-1"
                            formControlName="alcaldia"
                            (change)="onChangeAlcaldia()">
                            <option value="" selected>Seleccione una opción</option>
                            @for (item of catalogoAlcaldia; track item) {
                            <option [value]="item.id">{{item.demarcacion_territorial}}</option>
                            }
                        </select>
                    </div>

                    <div class="col-md-9">
                        <label class="form-label">Unidad Territorial</label>
                        <select class="form-select"
                        formControlName="ut"
                        (change)="onChangeUT()">
                        <option value="" selected>Seleccione una opción</option>
                        @for (item of catalogoUT; track item) {
                        <option [value]="item.id">{{item.unidad_territorial}}</option>
                        }
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Clave UT</label>
                        <input type="text" class="form-control" formControlName="claveUT" placeholder="">
                    </div>
                </div>

                <hr>

                <!-- CATEGORÍAS -->
            <h5 class="seccion-titulo">
                Selecciona la categoría que más describa tu problemàtica
                <a class="link-categorias" href="#" (click)="$event.preventDefault(); descargarCategorias()">
                    Conoce el catálogo de categorías
                </a>
            </h5>


                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Categoría</label>
                    </div>

                    <div class="col-md-9">
                        <select class="form-select"
                            class="form-select flex-grow-1"
                            formControlName="catUno"
                            (change)="onChangeCat()">
                            <option value="" selected>Seleccione una opción</option>
                            @for (item of primerCAt; track item) {
                            <option [value]="item.id">{{item.primera_categoria}}</option>
                            }
                        </select>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Segunda categoría</label>
                    </div>

                    <div class="col-md-8">
                        <select class="form-select"
                            class="form-select flex-grow-1"
                            formControlName="catDos"
                            (change)="onChangeCatDos()">
                            <option value="" selected>Seleccione una opción</option>
                            @for (item of segundaCat; track item) {
                            <option [value]="item.id">{{item.segunda_categoria}}</option>
                            }
                        </select>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Categoría específica</label>
                    </div>

                    <div class="col-md-8">
                        <select class="form-select"
                            class="form-select flex-grow-1"
                            formControlName="catTres">
                            <option value="" selected>Seleccione una opción</option>
                            @for (item of tercerCat; track item) {
                            <option [value]="item.id">{{item.tercera_categoria}}</option>
                            }
                        </select>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Enfoque específico</label>
                    </div>

                    <div class="col-md-8">
                        <select class="form-select"
                            class="form-select flex-grow-1"
                            formControlName="enfoqueEsp">
                            <option value="" selected>Seleccione una opción</option>
                            @for (item of enfoqueESP; track item) {
                            <option [value]="item.id">{{item.enfoque_especifico}}</option>
                            }
                        </select>
                    </div>
                </div>
                
                <hr>

                <!-- TÍTULO Y DESCRIPCIÓN -->
                <div class="mt-3">
                    <label class="form-label">Título de la necesidad</label>
                    <input type="text" class="form-control" formControlName="titulo" maxlength="200" placeholder="">
                </div>

                <div class="mt-3">
                    <label class="form-label">Descripción</label>
                    <textarea rows="4" class="form-control" maxlength="800" formControlName="descripcion"
                        placeholder=""></textarea>
                </div>

                <!-- BOTÓN -->
                @if(!isUpdate) {
                <div class="container text-center" *ngIf="tipo_usuario === 1">
                    <div class="row justify-content-center">
                        <div class="col-5">
                            <button class="btn-aceptar" type="submit" 
                            [disabled]="formularioRegistro.invalid">Guardar</button>
                        </div>
                        <div class="col-4">
                            <button class="btn-cancelar" type="button" (click)="cancelar()" data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </div>
                </div>
                }

                @if(isUpdate) {
                <div class="container text-center" *ngIf="tipo_usuario === 1">
                    <div class="row justify-content-center"> 
                        <div class="col-12">
                            <button class="btn-aceptar" type="button" (click)="cancelarExitoso()" data-bs-dismiss="modal">Aceptar</button>
                        </div>
                    </div>
                </div>
                }



                <div class="container text-center" *ngIf="tipo_usuario !== 1">
                    <div class="row justify-content-center">                       
                        <div class="col-4">
                            <button class="btn-aceptar" type="button" (click)="cancelar()" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
                </form>
            </div>
        </div>
    </div>
</div>
